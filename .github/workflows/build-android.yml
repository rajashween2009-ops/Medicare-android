
name: Build MediCare APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and extract Android project
        run: |
          mkdir source
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d source
          find source -name settings.gradle -o -name settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate project
        id: project
        run: |
          FILE=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
          test -n "$FILE"
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: medicare-build-${{ github.run_number }}
          name: MediCare APK build ${{ github.run_number }}
          files: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
