name: Build MediCare APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install

      - name: Sync UI from medicare-android.netlify.app & build offline bundle
        run: |
          curl -fsSL https://medicare-android.netlify.app/ -o www/index.html
          node scripts/patch-offline-ui.mjs
          npx tailwindcss -i www/input.css -o www/styles.css --content "www/index.html" --minify
          npx esbuild www/native-notifications.js --bundle --platform=browser --format=iife --outfile=www/native-notifications.bundle.js

      - name: Add Android platform & apply patches
        run: |
          npx cap add android
          node scripts/patch-android-manifest.mjs
          node scripts/patch-android-gradle.mjs android
          node scripts/patch-android-icons.mjs android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload MediCare APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediCare-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
